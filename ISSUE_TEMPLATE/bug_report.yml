name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Urbiva Go
        - Urbiva Vision
        - Urbiva Urban
        - Urbiva Impact
        - Other
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone, Chrome on Windows
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, personal data and faces or licence plates from screenshots.
          required: true
